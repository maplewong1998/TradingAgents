# specs/release-plan.yaml — release index and WSJF-ordered epic list.
#
# `release.version` is a non-authoritative MIRROR/label. semantic-release decides the
# real version at merge from Conventional Commits; read it with `gh release view`.
# Story status lives in specs/execution-status.yaml, never here.

release:
  version: "0.7.0"              # mirror of next expected tag, NOT authoritative — gh release view wins
  codename: "Augury Data Lake Integration"
  status: planning              # planning | in_progress | released
  semantic_release: true
  bump_hint: minor              # feat(dataflows) — CI decides at merge

epics:
  - id: e03
    title: Augury Data Lake Integration
    wsjf: 3.4
    capsule_dir: epics/e03-augury-data-lake
    note: >-
      Opt-in augury vendor behind the existing seam (six mapped methods) plus
      four augury-only tool categories (ai_forecast, valuation, signal_states,
      cross_sectional) bound conditionally to the existing market/fundamentals
      analysts. Defaults unchanged; AUGURY_BASE_URL config surface; zero graph
      change; zero new dependencies. WSJF = (BV 7 + TC 5 + RR 5) / JS 5.
      Scope + Prior Art: product/SCOPE_LATEST.yaml;
      research + decisions D1–D5: product/RESEARCH-2026-09-24-augury-data-source.md.
  - id: e02
    title: Conditional Bull/Bear Debate Gate
    wsjf: 4.8
    capsule_dir: epics/e02-conditional-debate-gate
    note: >-
      Gate the investment debate on evidence tension: LLM-judge node with
      Command routing, debate_gate always|auto|never (default auto),
      conservative skip with fail-safe to debate. Risk debate untouched.
      Closed 2026-09-20 (merged 26f3916); frozen scope at
      product/snapshots/release-0.6.0/SCOPE_LATEST.yaml.
  - id: e01
    title: Bigpowers Adoption (bootstrap)
    wsjf: 1.0
    capsule_dir: epics/e01-bigpowers-adoption
    note: >-
      One-off repo bootstrap: link bigpowers scripts/, seed specs/ + conventions,
      and derive the tech-stack doc via map-codebase. Closed 2026-09-20.
