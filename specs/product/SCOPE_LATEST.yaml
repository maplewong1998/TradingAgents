# specs/product/SCOPE_LATEST.yaml — what is in and out of scope.
# Produced by the scope-work skill (planning spine step 1).
# STATUS: BOUNDED — 2026-09-24, after grill-with-docs confirmation of five design
# decisions (D1 packs, D2 distribute-to-existing-agents, D3 opt-in routing,
# D4 intersection-only indicator map, D5 analyst-bound cross-sectional) recorded in
# specs/product/RESEARCH-2026-09-24-augury-data-source.md §6.
# Supersedes the e02 scope (frozen at snapshots/release-0.6.0/SCOPE_LATEST.yaml).

scope:
  initiative: augury-data-lake-integration
  feature_name: Augury Data Lake Integration
  status: bounded
  epic: e03   # story IDs assigned by slice-tasks; in_scope items map to e03sNN

  core_value: >-
    Point-in-time, lake-quality market data and augury-only AI signals for the
    existing agents through the one vendor seam — strictly opt-in, honestly
    degraded, never fabricated.

  summary: >-
    TradingAgents' analysts are served by live-vendor snapshots (yfinance first)
    whose present-day vintage is a known look-ahead risk in backtests, while the
    user's augury data lake (~/Repo_Private/augury, FastAPI on :8765) already
    serves PIT-native bars, features, fundamentals, financials, news, macro, and
    prediction markets — plus surfaces no TradingAgents method exists for
    (Kronos AI forecasts, multi-method valuation, versioned signal-family
    trigger states, cross-sectional feature vectors, universe, liquidity).

    This initiative wires augury in twice: (a) as a new `augury` vendor behind
    the existing `route_to_vendor` seam for six mapped methods, raising the
    existing `VendorError` taxonomy and selectable purely through `data_vendors`
    config strings — defaults unchanged, zero new dependencies, no router
    changes; and (b) as four new augury-only tool categories (ai_forecast,
    valuation, signal_states, cross_sectional) bound to the existing market and
    fundamentals analysts' ToolNodes and prompts only when the corresponding
    category is configured — the Portfolio Manager and the graph itself are
    untouched (D2, D5).

    Degradation is explicit by construction: augury's frozen ErrorResponse
    contract (e51s01: 404→not_found, 429→rate_limited) maps deterministically
    onto the VendorError taxonomy; an unmapped indicator, an unbackfilled
    ticker, or a stopped lake produces the standard NO_DATA / DATA_UNAVAILABLE
    sentinels — and the four new categories join the OPTIONAL_CATEGORIES
    fail-open pattern so enrichment can never abort a run.

  in_scope:
    - id: S1
      item: >-
        Augury vendor core: `dataflows/augury.py` HTTP client (requests, 30s
        timeout, ErrorResponse-aware error mapping), base-URL config surface
        (`augury_base_url` key + `AUGURY_BASE_URL` env override, default
        http://localhost:8765), `augury` registered in VENDOR_LIST /
        VENDOR_METHODS, and get_stock_data (OHLCV from /api/v1/bars) as the
        end-to-end tracer bullet
      maps_to: e03s01
    - id: S2
      item: >-
        PIT fundamentals pack: get_fundamentals (/api/v1/fundamentals?as_of=)
        plus get_balance_sheet / get_cashflow / get_income_statement
        (/api/v1/financials, split by its `statement` field, newest restatement
        per metric)
      maps_to: e03s02
    - id: S3
      item: >-
        get_indicators via an intersection-only name map onto served feature
        columns (D4 — unmapped advertised indicators raise NoMarketDataError so
        the chain falls through, e.g. to yfinance) and get_news via
        /news/{ticker} with a client-side `published_at <= curr_date` PIT
        filter (polymarket withholding precedent)
      maps_to: e03s03
    - id: S4
      item: >-
        get_macro_indicators (/macro calendar rows: actual/forecast/previous,
        `pit_approximate` rendered honestly) and get_prediction_markets
        (/prediction-markets, keyword-filtered by topic, withheld for past
        analysis dates like the live polymarket vendor)
      maps_to: e03s04
    - id: S5
      item: >-
        AI forecast pack (D1): new get_ai_forecast (Kronos bull/bear/neutral
        signals, predicted return, upside probability, degraded/stale flags
        rendered verbatim) and get_valuation (multi-method fair value, margin
        of safety) tools, bound to the market and fundamentals analysts
        respectively — only when their category is configured (D3 binding gate)
      maps_to: e03s05
    - id: S6
      item: >-
        Signal-family pack (D1): get_signal_states tool over
        /api/v1/signals/{ticker}?family=&as_of= exposing the versioned trigger
        families (sma_streak, sma_cross, rsi_cross, macd_cross, bb_cross,
        adx_breakout, psar_flip, hurst, regime, sentiment, insider,
        earnings_surprise, quality), bound to the market and fundamentals
        analysts under the same binding gate
      maps_to: e03s06
    - id: S7
      item: >-
        Cross-sectional pack, analyst-bound per D5: get_liquidity and
        get_feature_vector (single-ticker view of the batch endpoint, per-item
        `failed` slots rendered honestly) for the market analyst;
        get_universe_membership (PIT universe, delisted included) for the
        fundamentals analyst — no Portfolio Manager tool loop, zero graph change
      maps_to: e03s07
    - id: S8
      item: >-
        Honest degradation everywhere: 404/not_found → NoMarketDataError whose
        detail names the matching `POST /data/*` refresh job; 429 →
        VendorRateLimitError; unreachable/unconfigured lake →
        VendorNotConfiguredError or loud skip per the existing router
        reactions; new categories fail-open
      maps_to: e03   # acceptance woven through e03s01–e03s07
    - id: S9
      item: >-
        Test coverage per house TDD — every story RED-first, requests mocked at
        the vendor boundary (no live lake in CI), routing/fallback matrices,
        sentinel paths, and binding-gate on/off tests; Preflight
        (pytest -q && ruff check .) green at every story
      maps_to: e03   # all stories
    - id: S10
      item: >-
        Docs + knowledge refresh: CHANGELOG, .env.example (AUGURY_BASE_URL +
        opt-in data_vendors example), README config section, tech-stack.md
        vendor-seam refresh with re-measured counts, glossary terms (lake, PIT
        vintage, signal family)
      maps_to: e03s08

  out_of_scope:
    - item: Social sentiment pack (augury /social) + retiring the direct reddit/stocktwits imports
      reason: >-
        Declined in D1 (2026-09-24). The sentiment analyst pre-fetches and
        prompt-injects reddit/stocktwits (C5), so this is a data-path refactor,
        not a tool addition — revisit as its own initiative once the augury
        vendor pattern has shipped.
    - item: Augury-side schema/feature changes (sma_50, ema_10, Bollinger serving columns)
      reason: >-
        D4 chose the intersection-only map so this repo ships without waiting on
        a lake release; extending daily_feature serving is a versioned augury
        change owned by that repo's own cycle.
    - item: CLI vendor picker / interactive augury configuration
      reason: >-
        Config surface is `set_config` + `AUGURY_BASE_URL` env only (C6 — no
        vendor surface exists in the CLI today, and cli/main.py is the repo's
        highest-risk module, tech-stack signal 1). Docs show the config
        snippet instead.
    - item: TradingAgents triggering augury jobs (POST /data/* backfill/refresh)
      reason: >-
        TA is a read-only consumer of the lake; job scheduling is augury's own
        domain (augury AGENTS.md). The vendor only *hints* the matching job in
        its NO_DATA detail text.
    - item: get_global_news and get_insider_transactions via augury
      reason: >-
        No lake read endpoints exist for either (research §3); those methods
        stay on yfinance/alpha_vantage. A future augury endpoint can register
        later with zero seam changes.
    - item: Graph-shape changes (new analyst node, PM tool loop, debate-gate input changes)
      reason: >-
        D2/D5 chose distribution to existing agents; adding a PM ToolNode or a
        5th analyst would contradict the confirmed zero-graph-change constraint
        (and hit tech-stack signal 3's triple-encoding hazard).
    - item: Changing default vendor chains (augury as default primary or fallback)
      reason: >-
        D3 opt-in only — augury's default universe is HK-centric and reads are
        cache-first (C4), so a default augury chain would silently degrade
        US-ticker runs for anyone without a populated lake.
    - item: Live-lake integration tests in CI
      reason: >-
        House pattern mocks the vendor boundary (tests/conftest.py injects
        placeholder keys precisely so CI needs no services); augury's own Bruno
        contract suite owns the server side of the wire contract.

  constraints:
    - No new runtime dependencies — `requests` is already pinned; the augury
      Python package is never imported (it pins Python >=3.12, this repo
      supports >=3.10; HTTP is the boundary per both repos' "one API app" rule)
    - VendorError taxonomy only — no new `except` clause in route_to_vendor;
      new vendor behavior expressed through the existing base types
    - Defaults unchanged — a run with a stock config never calls augury;
      binding gate and prompt paragraphs are conditional on configuration (D3)
    - Fail-open on enrichment, fail-closed on data — the four new categories
      join OPTIONAL_CATEGORIES-style sentinels; mapped core categories keep
      raising per the existing taxonomy
    - Never fabricate — degraded/stale/withheld states are rendered verbatim
      (Kronos `degraded`, `stale_days`, `data_asof`; macro `pit_approximate`);
      unparseable or absent data yields sentinels, not estimates
    - Python >=3.10; Preflight (pytest -q && ruff check .) green at every step;
      ruff strict select unchanged; no repo-wide ruff format
    - Agent nodes stay closures from create_* factories; new tools follow the
      agents/utils/*_tools.py @tool + InjectedState(trade_date) + as_of clamp
      pattern (macro_data_tools.py precedent)
    - No API keys or payloads in logs — the base URL is the only
      secret-adjacent config and is not logged

  success_criteria:
    - Opted-in run (data_vendors core_stock_apis="augury,yfinance", lake up) —
      the market analyst's OHLCV evidence comes from augury bars, visible in
      the saved report; yfinance untouched when augury answers
    - Lake down mid-chain — core categories raise/surface per the taxonomy and
      the fallback vendor serves; the four new categories return
      DATA_UNAVAILABLE sentinels and the run completes
    - Unbackfilled ticker — NO_DATA_AVAILABLE sentinel whose detail names the
      matching POST /data/* job; agents report "unavailable", never estimate
    - Unmapped indicator (close_50_sma, close_10_ema, boll, boll_ub) requested
      with chain "augury,yfinance" — augury declines via NoMarketDataError,
      yfinance serves, log line shows the handoff
    - get_ai_forecast on a backtest date earlier than the forecast's data_asof —
      withheld with an explicit look-ahead explanation (polymarket precedent)
    - Stock config run — no augury tool bound, no augury paragraph in any
      prompt, byte-identical analyst prompts to today
    - get_signal_states with an unknown family — helpful message listing the
      valid families, no crash, no aborted run
    - Preflight green including the new mocked tests; ruff clean

  references:
    - specs/product/RESEARCH-2026-09-24-augury-data-source.md (dataflow research + Prior Art + grill decisions D1–D5)
    - specs/tech-architecture/tech-stack.md (§ The vendor seam; § Observability; signals 1/3/6)
    - ~/Repo_Private/augury/openapi.json (checked-in OpenAPI = http://localhost:8765/docs content)
    - ~/Repo_Private/augury/README.md (endpoint table, cache-first reads, Page[T] envelope)
    - ~/Repo_Private/augury/AGENTS.md (one-API-app boundary, jobs are the lake's domain)
    - ~/Repo_Private/augury/src/augury_record/api/errors.py (e51s01 frozen ErrorResponse contract)
    - "In-repo precedents: #988/#289 (configured chain IS the fallback), #989 (loud vendor failure), #1170 (REVIEW sentinel), date_window.as_of (PIT clamp)"

# ---------------------------------------------------------------------------
# Prior Art  (research-first, 2026-09-24 — full table with evidence in
# specs/product/RESEARCH-2026-09-24-augury-data-source.md)
# Search order: this repo -> bigpowers skills -> package registries/opensrc -> web docs.
# ---------------------------------------------------------------------------
prior_art:

  in_repo:
    - name: "route_to_vendor seam (TOOLS_CATEGORIES / VENDOR_METHODS / VENDOR_LIST)"
      path: tradingagents/dataflows/interface.py
      fit: extend
      note: >-
        Registration-only addition: `augury` key per mapped method plus four new
        categories for the augury-only tools. The configured list IS the chain
        (#988/#289); no router change, no new except clause.
    - name: "VendorError taxonomy"
      path: tradingagents/dataflows/errors.py
      fit: adopt
      note: >-
        Sized to router reactions by design; augury's e51 ErrorResponse codes
        (404 not_found / 429 rate_limited) map onto NoMarketDataError /
        VendorRateLimitError, unreachable lake onto VendorNotConfiguredError.
    - name: "polymarket.py vendor module"
      path: tradingagents/dataflows/polymarket.py
      fit: extend
      note: >-
        Template vendor: requests + REQUEST_TIMEOUT=30 + markdown report +
        live-only PIT self-censorship (withhold when curr_date < today) — the
        exact discipline reused for kronos/valuation/news/prediction-markets.
    - name: "fred.py get_api_key() config pattern"
      path: tradingagents/dataflows/fred.py
      fit: adopt
      note: "Lazy config resolution raising VendorNotConfiguredError — reused as get_base_url()."
    - name: "TRADINGAGENTS_DEBATE_GATE env override (e02s03)"
      path: tradingagents/default_config.py
      fit: extend
      note: "The env-override map pattern AUGURY_BASE_URL joins."
    - name: "reddit.py / stocktwits.py direct imports"
      path: tradingagents/agents/analysts/sentiment_analyst.py
      fit: build-later
      note: "Seam-bypass anomaly; augury /social is the natural replacement — deferred by D1."

  bigpowers_skills:
    - name: develop-tdd
      fit: compose
      note: "Every story RED-first with mocked requests boundary; e45s06 failing ledger."
    - name: plan-tests
      fit: compose
      note: "Risk-scaled scenario IDs per story if a test plan is requested before build."
    - name: validate-contracts
      fit: compose
      note: " augury's checked-in openapi.json is the wire contract to assert against in tests."

  external:
    - name: "augury_record FastAPI surface (checked-in OpenAPI)"
      url: http://localhost:8765/docs
      fit: compose
      note: >-
        Verified 2026-09-24 against ~/Repo_Private/augury/openapi.json:
        GET /api/v1/bars/{ticker} (start,end,fields,page,page_size max 200,
        newest-first); /api/v1/fundamentals/{ticker} (as_of required);
        /api/v1/financials/{ticker} (statement field, period_end desc);
        /news/{ticker} (days only — client-side PIT filter); /macro
        (actual/forecast/previous + pit_approximate); /prediction-markets
        (category/limit — client-side topic filter); /signals/{ticker}/kronos
        (degraded/data_available/stale_days flags); /valuation/{ticker} (404
        when no cached fundamentals); /api/v1/signals/{ticker} (family+as_of
        required, version pin optional); POST /api/v1/batch/feature-vector
        (1–500 tickers, per-item failed slots); /api/v1/universe (as_of, q;
        delisted included); /liquidity/{ticker}. Errors: frozen
        ErrorResponse{detail, code, request_id, errors[]}.
    - name: "opensrc cache"
      path: npx opensrc
      fit: none
      note: "Augury is a local first-party repo, not a registry package — read directly; no new dependency to look up."

verdict: >-
  COMPOSE + EXTEND, no new dependencies. One new vendor module
  (dataflows/augury.py) composed over augury's HTTP API via the already-pinned
  requests package; extensions are registration-only at the seam plus four new
  optional tool categories bound conditionally to existing analysts. Defaults
  unchanged (D3); indicator vocabulary is intersection-only (D4); the graph is
  untouched (D2/D5). Design decisions D1–D5 confirmed by grill-with-docs on
  2026-09-24.
